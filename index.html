<script>
(function(){
var wheel=document.getElementById('wheel');
var result=document.getElementById('result');
var center=document.getElementById('center');
var status=document.getElementById('status');
var spin=document.getElementById('spin');
var rotation=0,busy=false;
spin.addEventListener('click',function(){
 if(busy)return;
 busy=true;spin.disabled=true;status.textContent='Girando... 🔥';
 var n=Math.floor(Math.random()*72)+1;
 var numberAngle=(n-.5)*5-90;
 rotation += 360*(6+Math.floor(Math.random()*3)) - numberAngle;
 wheel.style.transform='rotate('+rotation+'deg)';
 setTimeout(function(){
   result.textContent=n;center.textContent=n;status.textContent='Salió el '+n+' 😎';
   busy=false;spin.disabled=false;
 },4600);
});
})();
</script>
