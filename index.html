<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ruleta 1 al 72</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#111;color:white;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
h1{margin:0 0 10px;font-size:28px}
#wheelWrap{position:relative;width:min(92vw,520px);aspect-ratio:1}
svg{width:100%;height:100%;display:block;transition:transform 4.8s cubic-bezier(.12,.72,.12,1)}
.pointer{position:absolute;z-index:5;top:-3px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid #e21b23;filter:drop-shadow(0 2px 2px #000)}
button{margin-top:18px;padding:15px 35px;border:0;border-radius:12px;background:#e21b23;color:#fff;font-size:20px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#result{margin-top:12px;font-size:25px;font-weight:bold;min-height:30px}
</style>
</head>
<body>
<h1>🎰 Ruleta 1 al 72</h1>
<div id="wheelWrap">
<div class="pointer"></div>
<svg id="wheel" viewBox="0 0 500 500" aria-label="Ruleta del 1 al 72">
<g id="rotor"></g>
<circle cx="250" cy="250" r="42" fill="#222" stroke="#fff" stroke-width="4"/>
<text id="center" x="250" y="260" text-anchor="middle" font-size="34" font-weight="bold" fill="#fff">?</text>
</svg>
</div>
<button id="spin">🎰 GIRAR</button>
<div id="result"></div>

<script>
const NS="http://www.w3.org/2000/svg";
const rotor=document.getElementById("rotor");
const wheel=document.getElementById("wheel");
const center=document.getElementById("center");
const result=document.getElementById("result");
const spin=document.getElementById("spin");

const N=72, cx=250, cy=250, R=238;
const step=360/N;

// Build wheel. Number 1 is centered at the top (the pointer position).
for(let i=0;i<N;i++){
  const a1=(i*step-step/2-90)*Math.PI/180;
  const a2=((i+1)*step-step/2-90)*Math.PI/180;
  const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
  const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
  const path=document.createElementNS(NS,"path");
  path.setAttribute("d",`M ${cx} ${cy} L ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2} Z`);
  path.setAttribute("fill",i%2?"#222":"#555");
  path.setAttribute("stroke","#fff");
  path.setAttribute("stroke-width","1");
  rotor.appendChild(path);

  // Text is rotated with the wheel; each number is centered in its sector.
  const ang=i*step-90;
  const rad=(ang)*Math.PI/180;
  const tr=190;
  const tx=cx+tr*Math.cos(rad), ty=cy+tr*Math.sin(rad);
  const t=document.createElementNS(NS,"text");
  t.textContent=i+1;
  t.setAttribute("x",tx); t.setAttribute("y",ty+6);
  t.setAttribute("text-anchor","middle");
  t.setAttribute("font-size","11");
  t.setAttribute("font-weight","bold");
  t.setAttribute("fill","#fff");
  t.setAttribute("transform",`rotate(${ang+90} ${tx} ${ty})`);
  rotor.appendChild(t);
}

let rotation=0;
let locked=false;

spin.addEventListener("click",()=>{
  if(locked)return;
  locked=true;
  spin.disabled=true;
  result.textContent="";
  center.textContent="?";

  // Choose the result first, then rotate so THAT sector's center lands
  // exactly at the fixed pointer (12 o'clock).
  const chosen=Math.floor(Math.random()*N)+1;
  const targetIndex=chosen-1;

  // Current visual angle of the chosen sector center is targetIndex*step.
  // We need its final angle to be 0, so add the required delta.
  const currentMod=((rotation%360)+360)%360;
  const desiredDelta=((360-(targetIndex*step+currentMod))%360);
  const extraTurns=(5+Math.floor(Math.random()*3))*360;
  rotation += extraTurns + desiredDelta;

  wheel.style.transform=`rotate(${rotation}deg)`;

  setTimeout(()=>{
    center.textContent=chosen;
    result.textContent=`Resultado: ${chosen}`;
    locked=false;
    spin.disabled=false;
  },4900);
});
</script>
</body>
</html>
